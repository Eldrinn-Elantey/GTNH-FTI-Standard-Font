name: Release ResourcePack

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number in SemVer format (x.y.z), without v prefix'
        required: true
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Determine release version
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
          else
            TITLE="$(echo "$PR_TITLE" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            VERSION="${TITLE#v}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              echo "Заголовок PR не содержит версию (x.y.z) — релиз пропущен."
              exit 0
            fi
            echo "❌ Неверный формат версии: '$VERSION'"
            exit 1
          fi

          echo "RELEASE=true" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Sync pack.mcmeta with release version
        if: env.RELEASE == 'true'
        shell: bash
        run: |
          set -euo pipefail

          PACK_GAME_VERSION="$(jq -r '.gtnh_resource_pack_updater.pack_game_version' pack.mcmeta)"

          jq \
            --arg version "${VERSION}" \
            --arg packGameVersion "${PACK_GAME_VERSION}" \
            '
            .gtnh_resource_pack_updater.pack_version = $version
            | .pack.description |= if test("§bv[0-9]+\\.[0-9]+\\.[0-9]+")
                then sub("§bv[0-9]+\\.[0-9]+\\.[0-9]+"; "§bv" + $version)
                else .
              end
            ' \
            pack.mcmeta > pack.mcmeta.tmp

          mv pack.mcmeta.tmp pack.mcmeta
          cat pack.mcmeta

      - name: Create zip archive
        if: env.RELEASE == 'true'
        shell: bash
        run: |
          set -euo pipefail

          ZIP_NAME="GTNH-FTI-Standard-Font-${VERSION}.zip"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

          zip -r "$ZIP_NAME" assets pack.mcmeta pack.png

      - name: Generate release JSON
        if: env.RELEASE == 'true'
        shell: bash
        run: |
          set -euo pipefail

          PACK_GAME_VERSION="$(jq -r '.gtnh_resource_pack_updater.pack_game_version' pack.mcmeta)"

          cat <<EOF > gtnh-pack-update.json
          {
            "schema": 1,
            "pack_game_version": "${PACK_GAME_VERSION}",
            "pack_version": "${VERSION}"
          }
          EOF

          cat gtnh-pack-update.json

      - name: Generate changelog
        if: env.RELEASE == 'true'
        shell: bash
        run: |
          set -euo pipefail

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [[ -n "$PREV_TAG" ]]; then
            git log "${PREV_TAG}..HEAD" --pretty="- %s" > RELEASE.md
          else
            git log --pretty="- %s" > RELEASE.md
          fi
          cat RELEASE.md

      - name: Create GitHub Release
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2.5.0
        with:
          tag_name: "${{ env.VERSION }}"
          name: "${{ env.VERSION }}"
          body_path: RELEASE.md
          target_commitish: "${{ github.event.pull_request.merge_commit_sha || github.sha }}"
          files: |
            ${{ env.ZIP_NAME }}
            gtnh-pack-update.json